<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靈感收集器</title>
<meta name="theme-color" content="#0D0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="靈感收集器">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0C0B; --surf:#151311; --surf2:#1D1A17; --line:#2A2622; --line2:#3A342E;
  --ink:#EFEAE2; --ink2:#A39A8E; --ink3:#6E665C;
  --warn:#E8B04B; --warn-bg:#2A2114; --err:#E0796F;
  --sans:'DM Sans','Noto Sans TC',sans-serif;
  --serif:'Instrument Serif','Noto Sans TC',serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
@media(min-width:900px){.wrap{max-width:900px}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:var(--surf2);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--line2)}
input::placeholder{color:var(--ink3)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

header{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 72%,transparent);padding:calc(18px + env(safe-area-inset-top)) 0 10px}
.htop{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--serif);font-size:28px;line-height:1;cursor:pointer}
.logo em{font-style:italic;color:var(--ink2)}
.hbtns{margin-left:auto;display:flex;gap:4px;align-items:center}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);transition:.15s}
.ico:hover{background:var(--surf2);color:var(--ink)}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sync{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-right:4px;white-space:nowrap;cursor:pointer}
#sync.err{color:var(--warn)}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:0 12px}
.search svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--ink3);stroke-width:1.7}
.search input{background:none;border:none;padding:11px 0}

.banner{margin:14px 0 0;background:var(--warn-bg);border:1px solid #4A3A18;border-radius:12px;padding:12px 14px;
  display:flex;gap:10px;align-items:flex-start}
.banner svg{width:17px;height:17px;flex:0 0 auto;margin-top:2px;fill:none;stroke:var(--warn);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.banner b{font-weight:500;color:var(--warn)}
.banner p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.banner .go{margin-left:auto;flex:0 0 auto;align-self:center;font-size:13px;color:var(--warn);border-bottom:1px solid #5A4620}

.sec{margin-top:26px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rule{height:1px;background:var(--line);flex:1}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:900px){.board{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surf2);
  border:1px solid var(--line);cursor:pointer;animation:pop .45s cubic-bezier(.2,.8,.3,1) backwards;
  animation-delay:calc(var(--i,0)*28ms)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--ink3)}
.tile:hover{border-color:var(--line2)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:10px;
  background:linear-gradient(transparent,rgba(6,5,4,.92));opacity:0;transition:.18s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:hover .cap{opacity:1}

.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:900px){.folders{grid-template-columns:repeat(6,1fr)}}
.folder{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:13px 8px 11px;text-align:center;
  transition:.16s;position:relative;overflow:hidden}
.folder:hover{transform:translateY(-2px);border-color:var(--line2)}
.folder .swatch{width:100%;height:3px;position:absolute;top:0;left:0;opacity:.85}
.folder .fico{width:26px;height:26px;margin:0 auto;display:block;fill:none;stroke-width:1.4;stroke-linejoin:round}
.folder .nm{margin-top:7px;font-size:12px;line-height:1.2;word-break:break-word}
.folder .ct{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:2px}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);
  background:var(--surf);transition:.14s;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--ink);color:#0D0C0B;border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg button{padding:6px 9px;color:var(--ink3);display:grid;place-items:center}
.seg button.on{background:var(--surf2);color:var(--ink)}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}

.grid{display:grid;gap:11px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g1{grid-template-columns:1fr}
@media(min-width:900px){.grid.g2{grid-template-columns:repeat(4,1fr)}.grid.g1{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
  transition:.16s;position:relative;touch-action:manipulation}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card.review{border-color:#4A3A18}
.card .thumb{aspect-ratio:4/3;background:var(--surf2);position:relative;overflow:hidden}
.grid.g1 .card .thumb{aspect-ratio:16/9}
.card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:30px;color:var(--ink3)}
.card .flag{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:6px;background:rgba(13,12,11,.8);
  display:grid;place-items:center}
.card .flag svg{width:12px;height:12px;fill:none;stroke:var(--warn);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .body{padding:9px 10px 11px}
.card .t{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
.src{font-family:var(--mono);font-size:10px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.dragging{opacity:.4}
.sorting .card,.sorting .row{cursor:grab}

.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line);
  background:var(--surf);cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surf2)}
.row .rt{flex:1;min-width:0}
.row .rt div:first-child{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sq{width:38px;height:38px;border-radius:7px;background:var(--surf2);flex:0 0 auto;overflow:hidden;
  display:grid;place-items:center;font-family:var(--serif);color:var(--ink3);position:relative}
.row .sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.empty{text-align:center;padding:52px 20px;color:var(--ink3)}
.empty .big{font-family:var(--serif);font-size:24px;color:var(--ink2);margin-bottom:6px}
.empty p{font-size:13.5px;margin:0 0 18px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:8px;
  background:var(--ink);color:#0D0C0B;border-radius:99px;padding:12px 20px;font-size:14px;font-weight:500;
  box-shadow:0 8px 28px rgba(0,0,0,.55)}
.fab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.fab:active{transform:translateX(-50%) scale(.97)}

.scrim{position:fixed;inset:0;background:rgba(6,5,4,.72);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surf);border-top:1px solid var(--line2);
  border-radius:20px 20px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  max-height:92vh;overflow-y:auto;padding:0 18px calc(28px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
@media(min-width:900px){.sheet{max-width:560px;margin:0 auto;border-radius:20px;bottom:24px;border:1px solid var(--line2)}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:10px auto 14px}
.sheet h2{font-family:var(--serif);font-size:22px;font-weight:400;margin:0 0 14px}
.fld{margin-bottom:14px}
.fld label{display:block;margin-bottom:6px}
.actions{display:flex;gap:9px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:var(--r);text-align:center;font-size:14px;border:1px solid var(--line2);color:var(--ink2)}
.btn:hover{color:var(--ink)}
.btn.pri{background:var(--ink);color:#0D0C0B;border-color:var(--ink);font-weight:500}
.btn.danger{border-color:#5A2A28;color:var(--err)}
.preview{display:flex;gap:11px;align-items:center;background:var(--surf2);border-radius:var(--r);padding:9px}
.preview .sq{width:52px;height:52px;border-radius:7px;background:var(--bg);flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);color:var(--ink3)}
.thumbedit{aspect-ratio:16/9;border-radius:var(--r);background:var(--surf2);border:1px dashed var(--line2);
  display:grid;place-items:center;overflow:hidden;position:relative;cursor:pointer}
.thumbedit img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbedit .hint{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;color:var(--ink3);
  background:rgba(13,12,11,.55);opacity:0;transition:.15s}
.thumbedit:hover .hint{opacity:1}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:280px;overflow-y:auto;padding:2px}
.pick{aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;
  border:1px solid var(--line);background:var(--surf2)}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick:hover{border-color:var(--ink2)}
.taglist{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tg{font-size:12.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--line2);display:flex;align-items:center;gap:6px}
.tg span{color:var(--ink3);cursor:pointer}
.catrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow .sw{width:15px;height:15px;border-radius:5px;flex:0 0 auto}
.catrow input{padding:5px 8px;font-size:13.5px}
.catbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.diag{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
  font-family:var(--mono);font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-all;color:var(--ink2)}
.diag .bad{color:var(--warn)}
.diag .ok{color:#8FCFA8}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:90px;z-index:80;background:var(--surf2);
  border:1px solid var(--line2);border-radius:99px;padding:9px 18px;font-size:13px;opacity:0;transition:.22s;
  pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div class="logo" id="brand">Inspiration <em>collector</em></div>
      <div class="hbtns">
        <span id="sync" title="點擊看資料設定"></span>
        <button class="ico" id="btnShuffle" aria-label="重新排列"><svg viewBox="0 0 24 24"><path d="M3 6h4l4 12h6M3 18h4l2-6"/><path d="M17 4l4 2-4 2M17 16l4 2-4 2"/></svg></button>
        <button class="ico" id="btnCats" aria-label="管理分類"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h11"/></svg></button>
        <button class="ico" id="btnData" aria-label="設定"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></button>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" placeholder="搜尋名稱、tag 或網址" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>貼上網址</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   儲存層 adapter
   資料一律先寫進這台裝置的 localStorage，關掉重開還在。
   接上 Google Sheet 只是選用的同步，用來跨裝置和備份。
   ===================================================================== */
const CFG={
  get api(){return localStorage.getItem('inspo:api')||''},
  set api(v){localStorage.setItem('inspo:api',v)},
  get token(){return localStorage.getItem('inspo:token')||''},
  set token(v){localStorage.setItem('inspo:token',v)}
};
const CACHE='inspo:cache';
let lastError='';

/** 把各種失敗轉成看得懂的中文，而不是 "Unexpected token <" */
async function readJson(r){
  const text=await r.text();
  let d;
  try{d=JSON.parse(text)}
  catch(e){
    if(/<!DOCTYPE|<html/i.test(text)){
      if(/accounts\.google\.com|登入|Sign in/i.test(text))
        throw new Error('回到 Google 登入頁 → 部署時「誰可以存取」要選「所有人」');
      throw new Error('回傳的是網頁不是資料 → 網址可能不是 /exec 結尾，或部署版本沒更新');
    }
    throw new Error('回傳格式不正確：'+text.slice(0,60));
  }
  if(d.error){
    if(d.error==='bad token')throw new Error('token 不符 → 網頁填的要跟 Code.gs 第一行的 TOKEN 一字不差');
    throw new Error(d.error);
  }
  return d;
}
function netError(e){
  if(e instanceof TypeError)
    return new Error('連不上 → 網址打錯，或你是用 file:// 直接開檔案（要用 http 伺服器或 GitHub Pages）');
  return e;
}

const Store={
  /** 有沒有接上 Google Sheet。沒接上不影響本機儲存。 */
  configured(){return !!CFG.api&&!!CFG.token},
  /** 寫進本機。回傳 false 代表 localStorage 空間滿了。 */
  writeLocal(links,cats){
    try{localStorage.setItem(CACHE,JSON.stringify({links,cats}));return true;}
    catch(e){return false;}
  },
  async load(){
    let d;
    try{d=await readJson(await fetch(CFG.api+'?token='+encodeURIComponent(CFG.token),{redirect:'follow'}));}
    catch(e){throw netError(e);}
    this.writeLocal(d.links,d.cats);return d;
  },
  cached(){try{return JSON.parse(localStorage.getItem(CACHE))}catch(e){return null}},
  async post(payload){
    try{
      // text/plain 是關鍵：避開 CORS preflight，Apps Script 不處理 OPTIONS
      return await readJson(await fetch(CFG.api,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(Object.assign({token:CFG.token},payload))}));
    }catch(e){throw netError(e);}
  },
  async save(links,cats){return await this.post({action:'save',links,cats});},
  async upload(dataUrl,name){return (await this.post({action:'upload',data:dataUrl,name})).url;},
  async thumbs(){
    try{return (await readJson(await fetch(
      CFG.api+'?action=thumbs&token='+encodeURIComponent(CFG.token),{redirect:'follow'}))).files||[];}
    catch(e){throw netError(e);}
  }
};
/* ===================================================================== */

const DEFAULT_CATS=[
 {id:'uiux',name:'UIUX',color:'#A79BFF'},
 {id:'graphic',name:'graphic',color:'#F0925F'},
 {id:'motion',name:'motion',color:'#4FD1A5'},
 {id:'video',name:'video',color:'#EE7CA9'},
 {id:'web3',name:'web3',color:'#66A9F0'},
 {id:'others',name:'others',color:'#9A9288',locked:true}
];
const PALETTE=['#A79BFF','#F0925F','#4FD1A5','#EE7CA9','#66A9F0','#E8B04B','#7FD3E0','#C98BE0','#9A9288'];

let state={links:[],cats:JSON.parse(JSON.stringify(DEFAULT_CATS))};
let view={name:'home',cat:null,size:'g2',tags:[],sorting:false};
let shuffleSeed=Date.now(),thumbFiles=null;

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u||''}}
function initial(s){return (String(s||'?').trim().charAt(0)||'?').toUpperCase()}
function catById(id){return state.cats.find(c=>c.id===id)}
function catColor(id){const c=catById(id);return c?c.color:'#6E665C'}
function normUrl(u){u=(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function guessTitle(u){try{const x=new URL(u);
  let p=decodeURIComponent(x.pathname).split('/').filter(Boolean).pop()||'';
  p=p.replace(/\.(html?|php|aspx?)$/i,'').replace(/[-_+]/g,' ').replace(/\d{6,}/g,'').trim();
  if(p.length>2)return p.replace(/\b\w/g,m=>m.toUpperCase()).slice(0,80);
  return x.hostname.replace(/^www\./,'');}catch(e){return u}}
function reviewCount(){return state.links.filter(l=>l.needsReview).length}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4000);}
function setSync(txt,err){const s=document.getElementById('sync');s.textContent=txt;s.classList.toggle('err',!!err);}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shuffled(a,seed){const r=rng(seed),x=a.slice();
  for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function allTags(links){const m={};links.forEach(l=>(l.tags||[]).forEach(t=>m[t]=(m[t]||0)+1));
  return Object.keys(m).sort((a,b)=>m[b]-m[a]);}
function matchQ(l,q){q=q.toLowerCase();
  return (l.title||'').toLowerCase().includes(q)||(l.url||'').toLowerCase().includes(q)||
         (l.tags||[]).some(t=>t.toLowerCase().includes(q));}
function img(l){return l.thumb?`<img src="${esc(l.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}

let saveT=null;
function save(){
  clearTimeout(saveT);
  if(!Store.writeLocal(state.links,state.cats)){
    setSync('裝置空間滿了',true);
    lastError='localStorage 寫不進去，通常是本機縮圖太多';
    toast('這台裝置的儲存空間滿了，移除幾張縮圖或接上 Google Sheet');
    return;
  }
  if(!Store.configured()){setSync('已存本機');return;}
  setSync('待同步');
  saveT=setTimeout(async()=>{
    setSync('同步中…');
    try{await Store.save(state.links,state.cats);setSync('已同步');lastError='';}
    catch(e){setSync('同步失敗',true);lastError=e.message;toast(e.message);}
  },700);
}

/** 本機縮圖直接以 data URL 存在 localStorage，所以壓得比雲端版本小 */
function fileToThumb(file,max,quality){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{let w=im.width,h=im.height;
      const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',quality));};
    im.onerror=rej;im.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}

  const m=document.getElementById('main');

function setupSheet(){
  openSheet(`<h2>接上 Google Sheet</h2>
    <p style="font-size:13.5px;color:var(--ink2);margin:0 0 16px">這一步是選用的。不填也能一直用，只是靈感只留在這台裝置。</p>
    <div class="fld"><label class="mono">Apps Script 網頁應用程式網址</label>
      <input id="sApi" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.api)}"></div>
    <div class="fld"><label class="mono">Token</label>
      <input id="sTok" placeholder="跟 Code.gs 第一行的 TOKEN 一樣" value="${esc(CFG.token)}"></div>
    <p class="mono">Token 不是 Google 給的，是你自己在 Code.gs 裡設的字串。兩項只存在這台裝置，不會進 git。</p>
    <div class="actions"><button class="btn" data-close="1">取消</button><button class="btn pri" id="sGo">測試並連線</button></div>`);
  document.getElementById('sGo').onclick=async()=>{
    const api=document.getElementById('sApi').value.trim();
    const token=document.getElementById('sTok').value.trim();
    if(!api||!token){toast('兩欄都要填');return;}
    const localLinks=state.links.slice(),localCats=state.cats.slice();
    CFG.api=api;CFG.token=token;
    setSync('連線中…');
    try{
      const d=await Store.load();
      const remote=d.links||[];
      if(!remote.length&&localLinks.length){
        // Sheet 還是空的：把這台裝置已有的靈感推上去，不要被空資料蓋掉
        await Store.save(localLinks,localCats);
        Store.writeLocal(localLinks,localCats);
        toast(`已把本機 ${localLinks.length} 筆靈感上傳到 Sheet`);
      }else if(remote.length&&localLinks.length&&
               !confirm(`Sheet 上有 ${remote.length} 筆靈感，這台裝置有 ${localLinks.length} 筆。\n按確定會改用 Sheet 上的資料。`)){
        CFG.api='';CFG.token='';
        Store.writeLocal(localLinks,localCats);
        setSync('已存本機');return;
      }else{
        state.links=remote;state.cats=(d.cats&&d.cats.length)?d.cats:state.cats;
        toast('連上了');
      }
      setSync('已同步');lastError='';closeSheet();render();}
    catch(e){setSync('連線失敗',true);lastError=e.message;diagSheet();}
  };
}

  openSheet(`<h2>連線診斷</h2>

${lastError?`\n<span class="bad">最後一次錯誤</span>\n${esc(lastError)}`:''}</div>

  document.getElementById('aCats').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;

      thumb:'',createdAt:Date.now(),order:mx+1,needsReview:false});
    save();closeSheet();shuffleSeed=Date.now();render();toast('已存入靈感庫');};

function editSheet(id){
  const l=state.links.find(x=>x.id===id);if(!l)return;
  let sel=(l.cats||[]).slice(),tags=(l.tags||[]).slice();
  const draw=()=>{
    openSheet(`<h2>編輯靈感</h2>
      <div class="thumbedit" id="eThumb"><span class="mono" style="position:absolute">點擊上傳縮圖</span>

      <div class="bar" style="margin-top:10px">${Store.configured()?'<button class="chip" id="ePick">從雲端資料夾挑</button>':''}
        <button class="chip" id="eThumbUrl">用圖片網址</button>
        ${l.thumb?'<button class="chip" id="eThumbClear">移除縮圖</button>':''}</div>
      <div class="fld"><label class="mono">名稱</label><input id="eTitle" value="${esc(l.title)}"></div>
      <div class="fld"><label class="mono">網址</label><input id="eUrl" value="${esc(l.url)}"></div>
      <div class="fld"><label class="mono">分類 · 可多選</label><div class="taglist" id="eCats">${catPicker(sel)}</div></div>
      <div class="fld"><label class="mono">Tag</label><div class="taglist" id="eTags">
        ${tags.map(t=>`<span class="tg">#${esc(t)}<span data-rmtag="${esc(t)}">×</span></span>`).join('')}
        <input id="eNewTag" placeholder="輸入後按 Enter" style="width:auto;flex:1;min-width:130px;padding:5px 10px;font-size:12.5px"></div></div>
      <div class="actions"><button class="btn danger" id="eDel">刪除</button>
        <button class="btn" data-open-url="${esc(l.url)}">開啟</button>
        <button class="btn pri" id="eSave">儲存</button></div>`);
    document.getElementById('eThumb').onclick=()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.onchange=async()=>{if(!inp.files[0])return;
        try{
          if(Store.configured()){
            toast('上傳到雲端資料夾…');
            l.thumb=await Store.upload(await fileToThumb(inp.files[0],900,.8),l.id);
            thumbFiles=null;
          }else{
            l.thumb=await fileToThumb(inp.files[0],520,.7);
          }
          save();draw();render();toast('縮圖已更新');}
        catch(e){toast('縮圖失敗：'+e.message);}};
      inp.click();};
    const pick=document.getElementById('ePick');
    if(pick)pick.onclick=()=>pickSheet(l,draw);
    document.getElementById('eThumbUrl').onclick=()=>{const v=prompt('貼上圖片網址');
      if(v){l.thumb=normUrl(v);save();draw();render();}};
    const clr=document.getElementById('eThumbClear');
    if(clr)clr.onclick=()=>{l.thumb='';save();draw();render();};
    document.getElementById('eCats').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;
      sel=sel.includes(b.dataset.pick)?sel.filter(x=>x!==b.dataset.pick):sel.concat(b.dataset.pick);
      document.getElementById('eCats').innerHTML=catPicker(sel);};
    const nt=document.getElementById('eNewTag');
    nt.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();
      const v=nt.value.trim().replace(/^#/,'');if(v&&!tags.includes(v)){tags.push(v);draw();}}};
    document.getElementById('eTags').onclick=e=>{const b=e.target.closest('[data-rmtag]');if(!b)return;
      tags=tags.filter(t=>t!==b.dataset.rmtag);draw();};
    document.getElementById('eDel').onclick=()=>{if(!confirm('刪除這筆靈感？'))return;
      state.links=state.links.filter(x=>x.id!==l.id);save();closeSheet();render();toast('已刪除');};
    document.getElementById('eSave').onclick=()=>{
      l.title=document.getElementById('eTitle').value.trim()||guessTitle(l.url);
      l.url=normUrl(document.getElementById('eUrl').value);
      l.cats=sel.length?sel:['others'];l.tags=tags;
      if(l.needsReview&&sel.length)l.needsReview=false;
      save();closeSheet();render();toast('已儲存');};
  };
  draw();
}

      const v=document.getElementById('cNew').value.trim();if(!v)return;
      state.cats.splice(Math.max(0,state.cats.length-1),0,
        {id:uid(),name:v,color:PALETTE[state.cats.length%PALETTE.length]});
      save();draw();render();};
    document.getElementById('cBox').oninput=e=>{const i=e.target.closest('[data-rename]');if(!i)return;
      const c=catById(i.dataset.rename);if(c&&!c.locked){c.name=i.value;save();}};
    document.getElementById('cBox').onclick=e=>{
      const sw=e.target.closest('[data-color]');
      if(sw){const c=catById(sw.dataset.color);
        c.color=PALETTE[(PALETTE.indexOf(c.color)+1)%PALETTE.length];save();draw();render();return;}
      const d=e.target.closest('[data-delcat]');
      if(d){const c=catById(d.dataset.delcat);
        const aff=state.links.filter(l=>(l.cats||[]).includes(c.id));
        if(!confirm(`刪除「${c.name}」？\n${aff.length} 筆靈感會被標記為待更新。`))return;
        aff.forEach(l=>{l.cats=(l.cats||[]).filter(x=>x!==c.id);if(!l.cats.length)l.needsReview=true;});
        state.cats=state.cats.filter(x=>x.id!==c.id);
        if(view.cat===c.id){view.name='home';view.cat=null;}
        save();draw();render();
        if(aff.length)toast(`${aff.length} 筆靈感需要重新指定分類`);}};
  };
  draw();
}

function bulkSheet(){
  let sel=[];
  const draw=()=>{
    openSheet(`<h2>批次指定分類</h2>
      <p style="font-size:13.5px;color:var(--ink2);margin:0 0 14px">會套用到全部 ${reviewCount()} 筆待更新靈感。</p>
      <div class="taglist" id="bCats">${catPicker(sel)}</div>
      <div class="actions"><button class="btn" data-close="1">取消</button><button class="btn pri" id="bGo">套用</button></div>`);
    document.getElementById('bCats').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;
      sel=sel.includes(b.dataset.pick)?sel.filter(x=>x!==b.dataset.pick):sel.concat(b.dataset.pick);draw();};
    document.getElementById('bGo').onclick=()=>{
      if(!sel.length){toast('先選一個分類');return;}
      state.links.filter(l=>l.needsReview).forEach(l=>{l.cats=sel.slice();l.needsReview=false;});
      save();closeSheet();view.name='home';render();toast('已更新');};
  };
  draw();
}

function dataSheet(){
  const linked=Store.configured();
  openSheet(`<h2>資料</h2>
    <p style="font-size:13.5px;color:var(--ink2);margin:0 0 16px">${linked
      ? '資料同時存在這台裝置和你的 Google Sheet，縮圖放在指定的 Drive 資料夾。'
      : '資料存在這台裝置的瀏覽器裡，關掉重開都還在。想跨裝置或多一份備份，才需要接 Google Sheet。'}</p>
    <div class="bar">
      <button class="chip" id="dJson">下載 JSON 備份</button>
      <button class="chip" id="dImport">從 JSON 匯入</button></div>
    <div class="bar" style="margin-top:10px">
      ${linked?`<button class="chip" id="dReload">重新從 Sheet 讀取</button>
        <button class="chip" id="dDiag">連線診斷</button>
        <button class="chip" id="dUnlink">中斷同步</button>`
      :`<button class="chip" id="dSetup">接上 Google Sheet（選用）</button>`}</div>
    <p class="mono" style="margin-top:16px">目前 ${state.links.length} 筆靈感 · ${state.cats.length} 個分類 · ${linked?'本機 + Google Sheet':'只存這台裝置'}</p>
    ${linked?'':'<p class="mono">清掉瀏覽器資料會一起清掉靈感，建議偶爾下載一份 JSON。</p>'}
    <div class="actions"><button class="btn pri" data-close="1">完成</button></div>`);
  document.getElementById('dJson').onclick=()=>{
    const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='inspiration-collector.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('備份已下載');};
  document.getElementById('dImport').onclick=()=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;
      const fr=new FileReader();
      fr.onload=()=>{
        let d;
        try{d=JSON.parse(fr.result);}catch(e){toast('這個檔案不是有效的 JSON');return;}
        if(!d||!Array.isArray(d.links)){toast('檔案裡找不到 links 資料');return;}
        if(!confirm(`匯入 ${d.links.length} 筆靈感，會覆蓋目前的 ${state.links.length} 筆。要繼續嗎？`))return;
        state.links=d.links;
        if(Array.isArray(d.cats)&&d.cats.length)state.cats=d.cats;
        save();closeSheet();shuffleSeed=Date.now();render();toast('已匯入');};
      fr.onerror=()=>toast('檔案讀不到');
      fr.readAsText(f);};
    inp.click();};
  const reload=document.getElementById('dReload');
  if(reload)reload.onclick=async()=>{
    setSync('讀取中…');thumbFiles=null;
    try{const d=await Store.load();
      state.links=d.links;state.cats=(d.cats&&d.cats.length)?d.cats:state.cats;
      setSync('已同步');lastError='';closeSheet();render();toast('已重新讀取');}
    catch(e){setSync('讀取失敗',true);lastError=e.message;diagSheet();}};
  const diag=document.getElementById('dDiag');
  if(diag)diag.onclick=diagSheet;
  const setup=document.getElementById('dSetup');
  if(setup)setup.onclick=setupSheet;
  const unlink=document.getElementById('dUnlink');
  if(unlink)unlink.onclick=()=>{
    if(!confirm('中斷跟 Google Sheet 的同步？\n靈感會留在這台裝置，Sheet 上的資料也不會被刪。'))return;
    CFG.api='';CFG.token='';thumbFiles=null;
    setSync('已存本機');lastError='';closeSheet();render();toast('已改回只存本機');};
}

/* ------------------------------------------------------- drag reorder */
let drag=null;
function startDrag(e,card){
  const wrap=document.getElementById('gridWrap');if(!wrap)return;
  drag={card,wrap};card.classList.add('dragging');card.setPointerCapture(e.pointerId);
}
function moveDrag(e){
  if(!drag)return;
  for(const n of [...drag.wrap.children]){
    if(n===drag.card)continue;
    const r=n.getBoundingClientRect();
    if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){
      const after=(e.clientY-r.top)>r.height/2||(e.clientX-r.left)>r.width/2;
      drag.wrap.insertBefore(drag.card,after?n.nextSibling:n);break;}}
}
function endDrag(){
  if(!drag)return;
  drag.card.classList.remove('dragging');
  [...drag.wrap.children].forEach((n,i)=>{const l=state.links.find(x=>x.id===n.dataset.id);if(l)l.order=i;});
  drag=null;save();
}

/* ------------------------------------------------------------- events */
function bind(root){
  root.onclick=e=>{
    const go=e.target.closest('[data-go]');
    if(go){if(go.dataset.go==='home')view={name:'home',cat:null,size:view.size,tags:[],sorting:false};
      else view.name='review';render();return;}
    const cat=e.target.closest('[data-cat]');
    if(cat){view.name='folder';view.cat=cat.dataset.cat;view.tags=[];view.sorting=false;render();return;}
    const sz=e.target.closest('[data-size]');
    if(sz){view.size=sz.dataset.size;render();return;}
    const tg=e.target.closest('[data-tag]');
    if(tg){const t=tg.dataset.tag;
      view.tags=view.tags.includes(t)?view.tags.filter(x=>x!==t):view.tags.concat(t);render();return;}
    const sm=e.target.closest('[data-sortmode]');
    if(sm){view.sorting=!view.sorting;render();toast(view.sorting?'拖拉卡片調整順序':'排序完成');return;}
    const bk=e.target.closest('[data-bulk]');
    if(bk){if(bk.dataset.bulk==='others'){
        state.links.filter(l=>l.needsReview).forEach(l=>{l.cats=['others'];l.needsReview=false;});
        save();view.name='home';render();toast('已全部移到 others');}
      else bulkSheet();return;}
    if(view.sorting)return;
    const op=e.target.closest('[data-open]');
    if(op)editSheet(op.dataset.open);
  };
  root.onpointerdown=e=>{if(!view.sorting)return;
    const c=e.target.closest('.card,.row');if(c){e.preventDefault();startDrag(e,c);}};
  root.onpointermove=moveDrag;
  root.onpointerup=endDrag;
  root.onpointercancel=endDrag;
}

sheetBody.addEventListener('click',e=>{
  if(e.target.closest('[data-close]'))closeSheet();
  const u=e.target.closest('[data-open-url]');
  if(u)window.open(u.dataset.openUrl,'_blank','noopener');
});
document.getElementById('fab').onclick=()=>addSheet('');
document.getElementById('btnCats').onclick=catSheet;
document.getElementById('btnData').onclick=dataSheet;
document.getElementById('sync').onclick=()=>{Store.configured()?diagSheet():dataSheet();};
document.getElementById('btnShuffle').onclick=()=>{shuffleSeed=Date.now();
  if(view.name!=='home'){view.name='home';view.cat=null;}render();};
document.getElementById('brand').onclick=()=>{
  view={name:'home',cat:null,size:view.size,tags:[],sorting:false};
  document.getElementById('q').value='';render();};
let qT=null;
document.getElementById('q').oninput=()=>{clearTimeout(qT);qT=setTimeout(render,160);};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
window.addEventListener('paste',e=>{
  if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(sheet.classList.contains('on'))return;
  const t=(e.clipboardData||window.clipboardData).getData('text');
  if(t&&/^(https?:\/\/|www\.)/i.test(t.trim()))addSheet(t.trim());});

(async()=>{
  const c=Store.cached();
  if(c){state.links=c.links||[];if(c.cats&&c.cats.length)state.cats=c.cats;}
  render();
  if(!Store.configured()){setSync('已存本機');return;}
  setSync('讀取中…');
  try{const d=await Store.load();
    state.links=d.links;state.cats=(d.cats&&d.cats.length)?d.cats:state.cats;
    setSync('已同步');lastError='';render();}
  catch(e){setSync('讀取失敗',true);lastError=e.message;toast(e.message);}
})();

if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
